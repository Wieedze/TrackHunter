      <!-- GitHub Pages SPA routing fix -->
      <script>
            (function(l) {
                    if (l.search[1] === '/') {
                              var decoded = l.search.slice(1).split('&').map(function(s) {
                                          return s.replace(/~and~/g, '&');
                              });
                              window.history.replaceState(null, null,
                                                                    l.pathname.slice(0, -1) + decoded[0] +
                                                                    (decoded[1] ? '?' + decoded[1] : '') + l.hash
                                                                  );
                    }
            }(window.location));
      </script>

                <button onclick="setCookieConsent('granted')" style="padding:8px 16px;background:#4ade80;border:none;color:#000;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600">Accept</button>button>

  <script>
        function setCookieConsent(choice) {
                localStorage.setItem('cookie_consent', choice);
                document.getElementById('cookie-banner').style.display = 'none';
                if (choice === 'granted') {
                          window.dataLayer = window.dataLayer || [];
                          function gtag(){dataLayer.push(arguments);}
                          gtag('consent', 'update', { analytics_storage: 'granted', ad_storage: 'granted' });
                }
        }
        window.addEventListener('DOMContentLoaded', function() {
                var consent = localStorage.getItem('cookie_consent');
                if (!consent) {
                          document.getElementById('cookie-banner').style.display = 'flex';
                }
                if (consent === 'denied') {
                          window.dataLayer = window.dataLayer || [];
                          function gtag(){dataLayer.push(arguments);}
                          gtag('consent', 'update', { analytics_storage: 'denied', ad_storage: 'denied' });
                }
        });
  </script>
