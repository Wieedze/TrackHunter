<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO: per-route title, description, canonical, Open Graph and JSON-LD
       are injected here by scripts/prerender.mjs (data in src/seo.ts). -->
  <!--seo-head-->
  <meta name="author" content="TrackHunter" />
  <meta name="theme-color" content="#0A0A0A" />

  <!-- Bing Webmaster Verification -->
  <meta name="msvalidate.01" content="269F64DC3F06A3243E37EA4801D6F90C" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Google Analytics — default consent denied (GDPR compliant) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XC5XBJYWL2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      wait_for_update: 500
    });
    gtag('js', new Date());
    gtag('config', 'G-XC5XBJYWL2', { anonymize_ip: true });
  </script>

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1397018571870268" crossorigin="anonymous"></script>
</head>
<body class="bg-[#0A0A0A] text-[#E8E8E8] font-body antialiased">

  <!-- GDPR Cookie Banner -->
  <div id="cookie-banner" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#111;border-top:1px solid #2a2a2a;padding:16px 24px;font-family:'DM Sans',sans-serif;font-size:14px;color:#ccc;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between">
    <span style="flex:1;min-width:200px">
      We use cookies for analytics and ads. By clicking "Accept", you consent to our use of cookies.
      <a href="/privacy" style="color:#4ade80;text-decoration:underline">Privacy Policy</a> ·
      <a href="/terms" style="color:#4ade80;text-decoration:underline">Terms</a>
    </span>
    <div style="display:flex;gap:8px;flex-shrink:0">
      <button onclick="setCookieConsent('denied')" style="padding:8px 16px;background:transparent;border:1px solid #555;color:#ccc;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit">Decline</button>
      <button onclick="setCookieConsent('granted')" style="padding:8px 16px;background:#4ade80;border:none;color:#000;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit">Accept</button>
    </div>
  </div>

  <script>
    function setCookieConsent(choice) {
      localStorage.setItem('cookie_consent', choice);
      document.getElementById('cookie-banner').style.display = 'none';
      gtag('consent', 'update', {
        analytics_storage: choice === 'granted' ? 'granted' : 'denied',
        ad_storage: choice === 'granted' ? 'granted' : 'denied',
        ad_user_data: choice === 'granted' ? 'granted' : 'denied',
        ad_personalization: choice === 'granted' ? 'granted' : 'denied'
      });
    }
    window.addEventListener('DOMContentLoaded', function() {
      var consent = localStorage.getItem('cookie_consent');
      if (!consent) {
        document.getElementById('cookie-banner').style.display = 'flex';
      } else if (consent === 'granted') {
        gtag('consent', 'update', {
          analytics_storage: 'granted',
          ad_storage: 'granted',
          ad_user_data: 'granted',
          ad_personalization: 'granted'
        });
      }
    });
  </script>

  <div id="root"><!--app-html--></div>

  <!-- Static backlink for GetSongBPM (required for API access) -->
  <footer style="text-align:center;padding:8px;font-size:11px;color:#666">
    <a href="https://getsongbpm.com" style="color:#888">BPM data by GetSongBPM</a>
  </footer>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
